<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Radiant Gold Core Gradient -->
    <linearGradient id="icon-gold-core" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#ffe494" />
      <stop offset="70%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#c98a1a" />
    </linearGradient>

    <!-- Radiant Gold Wing Gradient -->
    <linearGradient id="icon-gold-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b8" />
      <stop offset="50%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#b07914" />
    </linearGradient>
  </defs>

  <!-- Deep Black Square with Crisp White Border for Favicon/Icon Base -->
  <rect x="3" y="3" width="122" height="122" fill="#08080a" stroke="#ffffff" stroke-width="1.5" />

  <!-- Outer Acoustic Soundwave Arcs -->
  <path d="M 64 12 C 94 30 108 50 108 64 C 108 78 94 98 64 116" stroke="#ffd159" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />
  <path d="M 64 12 C 34 30 20 50 20 64 C 20 78 34 98 64 116" stroke="#ffd159" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85" />

  <!-- Concentric Dotted Resonance Rings -->
  <path d="M 64 22 C 86 36 96 50 96 64 C 96 78 86 92 64 106" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.45" />
  <path d="M 64 22 C 42 36 32 50 32 64 C 32 78 42 92 64 106" stroke="#ffffff" stroke-width="1" stroke-dasharray="2 4" fill="none" opacity="0.45" />

  <!-- Horizontal Acoustic Needles -->
  <polygon points="120,64 88,61 88,67" fill="url(#icon-gold-core)" />
  <polygon points="8,64 40,61 40,67" fill="url(#icon-gold-core)" />

  <!-- Upper Resonance Wings -->
  <path d="M 64 38 Q 88 32 102 18 Q 92 42 74 52 Z" fill="url(#icon-gold-wing)" stroke="#ffffff" stroke-width="0.75" />
  <path d="M 64 38 Q 40 32 26 18 Q 36 42 54 52 Z" fill="url(#icon-gold-wing)" stroke="#ffffff" stroke-width="0.75" />

  <!-- Lower Resonance Wings -->
  <path d="M 64 90 Q 88 96 102 110 Q 92 86 74 76 Z" fill="url(#icon-gold-wing)" stroke="#ffffff" stroke-width="0.75" />
  <path d="M 64 90 Q 40 96 26 110 Q 36 86 54 76 Z" fill="url(#icon-gold-wing)" stroke="#ffffff" stroke-width="0.75" />

  <!-- Mid Crescent Flanks -->
  <path d="M 76 56 Q 96 64 84 72 Q 78 68 76 56 Z" fill="#ffd159" stroke="#ffffff" stroke-width="0.5" />
  <path d="M 52 56 Q 32 64 44 72 Q 50 68 52 56 Z" fill="#ffd159" stroke="#ffffff" stroke-width="0.5" />

  <!-- Vertical Axis Needles (Top & Bottom) -->
  <polygon points="64,4 67.5,24 64,36 60.5,24" fill="url(#icon-gold-core)" stroke="#ffffff" stroke-width="0.75" />
  <polygon points="64,124 67.5,104 64,92 60.5,104" fill="url(#icon-gold-core)" stroke="#ffffff" stroke-width="0.75" />

  <!-- Outer Diamond Frame -->
  <polygon points="64,34 86,64 64,94 42,64" fill="none" stroke="#ffd159" stroke-width="1.8" />
  <polygon points="64,38 82,64 64,90 46,64" fill="#08080a" stroke="#ffffff" stroke-width="0.75" />

  <!-- Center Resonator Core Rhombus -->
  <polygon points="64,45 77,64 64,83 51,64" fill="url(#icon-gold-core)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Inner Core Cutout Void -->
  <polygon points="64,52 71,64 64,76 57,64" fill="#08080a" stroke="#ffd159" stroke-width="0.8" />

  <!-- Center Resonance Spark -->
  <polygon points="64,58 67,64 64,70 61,64" fill="#ffffff" />
</svg>
