<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Radiant Gold Gradients -->
    <linearGradient id="gold-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#ffe494" />
      <stop offset="70%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#e5a93c" />
    </linearGradient>

    <linearGradient id="gold-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699" />
      <stop offset="60%" stop-color="#ffd159" />
      <stop offset="100%" stop-color="#b88320" />
    </linearGradient>

    <radialGradient id="gold-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd159" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#b88320" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Black Backplate with Crisp White Border -->
  <rect x="6" y="6" width="116" height="116" fill="#08080a" stroke="#ffffff" stroke-width="1.5" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#gold-glow)" />

  <!-- Outer Sonic Wave Arcs in Gold -->
  <path d="M64 16 C88 32 98 52 98 64 C98 76 88 96 64 112" fill="none" stroke="#ffd159" stroke-width="1.8" stroke-linecap="square" opacity="0.8" />
  <path d="M64 16 C40 32 30 52 30 64 C30 76 40 96 64 112" fill="none" stroke="#ffd159" stroke-width="1.8" stroke-linecap="square" opacity="0.8" />

  <!-- Concentric Soundwave Marks with White Accents -->
  <path d="M64 26 C80 38 88 52 88 64 C88 76 80 90 64 102" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5" />
  <path d="M64 26 C48 38 40 52 40 64 C40 76 48 90 64 102" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.5" />

  <!-- Tacet Mark Primary Acoustic Wings / Spikes in Radiant Gold -->
  <!-- Top Central Needle Spike -->
  <polygon points="64,12 67,34 64,42 61,34" fill="url(#gold-core)" stroke="#ffffff" stroke-width="0.8" />
  <!-- Bottom Needle Spike -->
  <polygon points="64,116 67,94 64,86 61,94" fill="url(#gold-core)" stroke="#ffffff" stroke-width="0.8" />

  <!-- Upper Lateral Wings -->
  <path d="M64 44 Q82 38 92 26 Q86 46 72 54 Z" fill="url(#gold-wing)" stroke="#ffffff" stroke-width="0.6" />
  <path d="M64 44 Q46 38 36 26 Q42 46 56 54 Z" fill="url(#gold-wing)" stroke="#ffffff" stroke-width="0.6" />

  <!-- Lower Lateral Wings -->
  <path d="M64 84 Q82 90 92 102 Q86 82 72 74 Z" fill="url(#gold-wing)" stroke="#ffffff" stroke-width="0.6" />
  <path d="M64 84 Q46 90 36 102 Q42 82 56 74 Z" fill="url(#gold-wing)" stroke="#ffffff" stroke-width="0.6" />

  <!-- Mid Crescent Wave Claws -->
  <path d="M72 58 Q100 64 82 72 Q74 68 72 58 Z" fill="#ffd159" />
  <path d="M56 58 Q28 64 46 72 Q54 68 56 58 Z" fill="#ffd159" />

  <!-- Central Tacet Mark Rhombus (Heart Core) -->
  <polygon points="64,46 78,64 64,82 50,64" fill="url(#gold-core)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Inner Dark Resonance Void -->
  <polygon points="64,52 72,64 64,76 56,64" fill="#08080a" stroke="#ffd159" stroke-width="1" />
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />
</svg>
