<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Solaris Resonance Gradient -->
    <linearGradient id="tacet-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="tacet-core" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#ffe066" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="tacet-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070a12" stop-opacity="0" />
    </radialGradient>
    <filter id="mark-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Backplate -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="#070a12" stroke="#1e293b" stroke-width="2" />
  
  <!-- Ambient Tacet Field Glow -->
  <circle cx="64" cy="64" r="50" fill="url(#tacet-glow)" />

  <!-- Outer Sonic Wave Arcs (Resonance Field) -->
  <path d="M64 16 C88 32 98 52 98 64 C98 76 88 96 64 112" fill="none" stroke="url(#tacet-cyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />
  <path d="M64 16 C40 32 30 52 30 64 C30 76 40 96 64 112" fill="none" stroke="url(#tacet-cyan)" stroke-width="2.2" stroke-linecap="round" opacity="0.6" />

  <!-- Concentric Soundwave Marks -->
  <path d="M64 26 C80 38 88 52 88 64 C88 76 80 90 64 102" fill="none" stroke="url(#tacet-cyan)" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.4" />
  <path d="M64 26 C48 38 40 52 40 64 C40 76 48 90 64 102" fill="none" stroke="url(#tacet-cyan)" stroke-width="1.6" stroke-dasharray="4 4" opacity="0.4" />

  <!-- Tacet Mark Primary Acoustic Wings / Spikes -->
  <!-- Top Central Needle Spike -->
  <polygon points="64,12 67,34 64,42 61,34" fill="url(#tacet-core)" filter="url(#mark-blur)" />
  <!-- Bottom Needle Spike -->
  <polygon points="64,116 67,94 64,86 61,94" fill="url(#tacet-core)" filter="url(#mark-blur)" />

  <!-- Upper Lateral Wings -->
  <path d="M64 44 Q82 38 92 26 Q86 46 72 54 Z" fill="url(#tacet-cyan)" />
  <path d="M64 44 Q46 38 36 26 Q42 46 56 54 Z" fill="url(#tacet-cyan)" />

  <!-- Lower Lateral Wings -->
  <path d="M64 84 Q82 90 92 102 Q86 82 72 74 Z" fill="url(#tacet-cyan)" />
  <path d="M64 84 Q46 90 36 102 Q42 82 56 74 Z" fill="url(#tacet-cyan)" />

  <!-- Mid Crescent Wave Claws -->
  <path d="M72 58 Q100 64 82 72 Q74 68 72 58 Z" fill="url(#tacet-cyan)" />
  <path d="M56 58 Q28 64 46 72 Q54 68 56 58 Z" fill="url(#tacet-cyan)" />

  <!-- Central Tacet Mark Rhombus (Heart Core) -->
  <polygon points="64,46 78,64 64,82 50,64" fill="url(#tacet-core)" filter="url(#mark-blur)" stroke="#ffffff" stroke-width="1.2" />

  <!-- Inner Dark Resonance Void -->
  <polygon points="64,54 72,64 64,74 56,64" fill="#070a12" />

  <!-- Central Eye Stigma / Focus Dot -->
  <circle cx="64" cy="64" r="3.5" fill="url(#tacet-cyan)" />
</svg>
