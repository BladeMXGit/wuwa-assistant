<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wuwa-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="wuwa-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>
    <radialGradient id="halo-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f1b2e" />
      <stop offset="100%" stop-color="#070a12" />
    </radialGradient>
    <filter id="echo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark sci-fi backplate -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#halo-bg)" stroke="#1e293b" stroke-width="2.5" />

  <!-- Outer Resonance Halo -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="url(#wuwa-cyan)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="64" cy="64" r="36" fill="none" stroke="url(#wuwa-gold)" stroke-width="1.5" opacity="0.4" />

  <!-- Central Tacet / Wave Crest Symbol -->
  <path d="M64 26 C42 42 36 60 48 76 C54 84 64 96 64 102 C64 96 74 84 80 76 C92 60 86 42 64 26 Z" 
        fill="url(#wuwa-gold)" filter="url(#echo-glow)" opacity="0.9" />

  <!-- Inner Resonance Wave Ring -->
  <path d="M50 64 C50 56 56 50 64 50 C72 50 78 56 78 64 C78 72 72 78 64 78 C56 78 50 72 50 64 Z" 
        fill="#070a12" stroke="url(#wuwa-cyan)" stroke-width="3" />
        
  <!-- Center Resonance Core -->
  <circle cx="64" cy="64" r="5" fill="url(#wuwa-cyan)" />
</svg>
